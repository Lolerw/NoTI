<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NoTI Gestión de Horarios y Turnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        noti: {
                            500: '#15803d',
                            600: '#166534',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100/80 text-slate-800 antialiased font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Logo y Cabecera -->
        <div class="text-center mb-6">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 items-center justify-center text-white shadow-lg mb-3">
                <i class="ph-bold ph-calendar-blank text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">NoTI</h1>
            <p class="text-xs font-semibold text-emerald-700 uppercase tracking-widest mt-0.5">Plataforma de Horarios y Turnos</p>
            <p class="text-xs text-slate-500 mt-2">Ingresa tus credenciales para acceder al sistema</p>
        </div>

        <!-- Tarjeta de Login -->
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xl p-7">
            <!-- Banner de Alerta / Error -->
            <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700 font-semibold flex items-center gap-2">
                <i class="ph-bold ph-warning-circle text-base text-rose-600"></i>
                <span id="login-error-text">Credenciales incorrectas</span>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Nombre de Usuario</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <i class="ph-bold ph-user text-base"></i>
                        </span>
                        <input type="text" id="username" required autocomplete="username"
                            class="w-full pl-9 pr-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                            placeholder="ej. miguel o admin">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <i class="ph-bold ph-lock text-base"></i>
                        </span>
                        <input type="password" id="password" required autocomplete="current-password"
                            class="w-full pl-9 pr-10 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600">
                            <i id="password-toggle-icon" class="ph-bold ph-eye text-base"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-submit"
                    class="w-full py-2.5 px-4 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 hover:shadow-lg">
                    <span>Ingresar al Sistema</span>
                    <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>

            <!-- Panel de Cuentas de Prueba (Demo) -->
            <div class="mt-6 pt-5 border-t border-slate-100">
                <div class="flex items-center justify-between mb-2.5">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Acceso Rápido de Prueba (Demo):</span>
                    <span class="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded">1 Clic</span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-left">
                    <button type="button" onclick="quickFillAndLogin('admin', 'admin123')"
                        class="p-2 rounded-xl border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition-all text-left">
                        <div class="text-xs font-bold text-slate-900 flex items-center justify-between">
                            <span>Carlos Admin</span>
                            <span class="text-[9px] bg-blue-100 text-blue-800 px-1.5 py-0.2 rounded font-bold">ADMIN</span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono mt-0.5">admin / admin123</div>
                    </button>

                    <button type="button" onclick="quickFillAndLogin('miguel', 'miguel123')"
                        class="p-2 rounded-xl border border-slate-200 hover:border-emerald-400 hover:bg-emerald-50/40 transition-all text-left">
                        <div class="text-xs font-bold text-slate-900 flex items-center justify-between">
                            <span>Miguel S.</span>
                            <span class="text-[9px] bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded font-bold">SCHEDULER</span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono mt-0.5">miguel / miguel123</div>
                    </button>

                    <button type="button" onclick="quickFillAndLogin('cesar', 'cesar123')"
                        class="p-2 rounded-xl border border-slate-200 hover:border-emerald-400 hover:bg-emerald-50/40 transition-all text-left">
                        <div class="text-xs font-bold text-slate-900 flex items-center justify-between">
                            <span>César R.</span>
                            <span class="text-[9px] bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded font-bold">SCHEDULER</span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono mt-0.5">cesar / cesar123</div>
                    </button>

                    <button type="button" onclick="quickFillAndLogin('laura', 'laura123')"
                        class="p-2 rounded-xl border border-slate-200 hover:border-slate-400 hover:bg-slate-50 transition-all text-left">
                        <div class="text-xs font-bold text-slate-900 flex items-center justify-between">
                            <span>Laura V.</span>
                            <span class="text-[9px] bg-slate-200 text-slate-700 px-1.5 py-0.2 rounded font-bold">VISITANTE</span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono mt-0.5">laura / laura123</div>
                    </button>
                </div>
            </div>
        </div>

        <div class="text-center mt-6 text-slate-400 text-xs">
            NoTI &copy; 2026 - Gestión Operativa y Turnos por Equipos
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'ph-bold ph-eye-slash text-base';
            } else {
                pwd.type = 'password';
                icon.className = 'ph-bold ph-eye text-base';
            }
        }

        async function quickFillAndLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            await performLogin(username, password);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            await performLogin(u, p);
        }

        async function performLogin(username, password) {
            const errBox = document.getElementById('login-error');
            const btnSubmit = document.getElementById('btn-submit');
            errBox.classList.add('hidden');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i> Verificando...`;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    document.getElementById('login-error-text').textContent = data.detail || 'Credenciales inválidas';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('login-error-text').textContent = 'Error de conexión con el servidor';
                errBox.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<span>Ingresar al Sistema</span> <i class="ph-bold ph-arrow-right"></i>`;
            }
        }
    </script>
</body>
</html>
